[build-system]

requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-to-sqlite"
version = "0.1.0"
description = "Fetch Open-Meteo forecasts for five cities into SQLite and report on them."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
api_to_sqlite = ["sql/*/*.sql"]
